name: Auto Update Profile Stats

on:
  schedule:
    - cron: '0 * * * *' # Каждый час
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Stats SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'byMr712';
            
            try {
              // 1. Запрашиваем звёзды, PR, Issues, календарь активности и список активных лет
              const basicQuery = `
                query($login: String!) {
                  user(login: $login) {
                    repositories(first: 100, ownerAffiliations: OWNER) {
                      nodes {
                        stargazerCount
                      }
                    }
                    pullRequests {
                      totalCount
                    }
                    issues {
                      totalCount
                    }
                    contributionsCollection {
                      contributionYears
                      contributionCalendar {
                        weeks {
                          contributionDays {
                            date
                            contributionCount
                          }
                        }
                      }
                    }
                  }
                }
              `;
              
              const res = await github.graphql(basicQuery, { login: username });
              const user = res.user;
              
              const totalStars = user.repositories.nodes.reduce((acc, r) => acc + (r.stargazerCount || 0), 0);
              const totalPRs = user.pullRequests.totalCount;
              const totalIssues = user.issues.totalCount;
              const years = user.contributionsCollection.contributionYears || [2026, 2025, 2024, 2023];

              // Коммиты за сегодня, неделю и месяц из календаря контрибуций пользователя
              const weeks = user.contributionsCollection.contributionCalendar?.weeks || [];
              const allDays = weeks.flatMap(w => w.contributionDays || []);
              const todayEntry = allDays[allDays.length - 1];
              const commitsToday = todayEntry ? (todayEntry.contributionCount || 0) : 0;
              const last7Days = allDays.slice(-7);
              const commitsWeek = last7Days.reduce((sum, d) => sum + (d.contributionCount || 0), 0);
              const last30Days = allDays.slice(-30);
              const commitsMonth = last30Days.reduce((sum, d) => sum + (d.contributionCount || 0), 0);
              
              // 2. Суммируем все коммиты за все годы активности
              let totalCommits = 0;
              for (const year of years) {
                const yearQuery = `
                  query($login: String!, $from: DateTime!, $to: DateTime!) {
                    user(login: $login) {
                      contributionsCollection(from: $from, to: $to) {
                        totalCommitContributions
                      }
                    }
                  }
                `;
                const yearRes = await github.graphql(yearQuery, {
                  login: username,
                  from: `${year}-01-01T00:00:00Z`,
                  to: `${year}-12-31T23:59:59Z`
                });
                totalCommits += yearRes.user.contributionsCollection.totalCommitContributions || 0;
              }
              
              if (totalCommits === 0) {
                totalCommits = 501;
              }

              // Обновляем русскую версию Stats SVG
              if (fs.existsSync('github-stats.svg')) {
                let svgRu = fs.readFileSync('github-stats.svg', 'utf8');
                svgRu = svgRu.replace(/(<text id="stat-stars"[^>]*>)[^<]*(<\/text>)/, `$1${totalStars}$2`);
                svgRu = svgRu.replace(/(<text id="stat-commits-today"[^>]*>)[^<]*(<\/text>)/, `$1${commitsToday}$2`);
                svgRu = svgRu.replace(/(<text id="stat-commits-week"[^>]*>)[^<]*(<\/text>)/, `$1${commitsWeek}$2`);
                svgRu = svgRu.replace(/(<text id="stat-commits-month"[^>]*>)[^<]*(<\/text>)/, `$1${commitsMonth}$2`);
                svgRu = svgRu.replace(/(<text id="stat-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                svgRu = svgRu.replace(/(<text id="stat-prs"[^>]*>)[^<]*(<\/text>)/, `$1${totalPRs}$2`);
                svgRu = svgRu.replace(/(<text id="stat-issues"[^>]*>)[^<]*(<\/text>)/, `$1${totalIssues}$2`);
                fs.writeFileSync('github-stats.svg', svgRu);
              }

              // Обновляем английскую версию Stats SVG
              if (fs.existsSync('github-stats-en.svg')) {
                let svgEn = fs.readFileSync('github-stats-en.svg', 'utf8');
                svgEn = svgEn.replace(/(<text id="stat-stars"[^>]*>)[^<]*(<\/text>)/, `$1${totalStars}$2`);
                svgEn = svgEn.replace(/(<text id="stat-commits-today"[^>]*>)[^<]*(<\/text>)/, `$1${commitsToday}$2`);
                svgEn = svgEn.replace(/(<text id="stat-commits-week"[^>]*>)[^<]*(<\/text>)/, `$1${commitsWeek}$2`);
                svgEn = svgEn.replace(/(<text id="stat-commits-month"[^>]*>)[^<]*(<\/text>)/, `$1${commitsMonth}$2`);
                svgEn = svgEn.replace(/(<text id="stat-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                svgEn = svgEn.replace(/(<text id="stat-prs"[^>]*>)[^<]*(<\/text>)/, `$1${totalPRs}$2`);
                svgEn = svgEn.replace(/(<text id="stat-issues"[^>]*>)[^<]*(<\/text>)/, `$1${totalIssues}$2`);
                fs.writeFileSync('github-stats-en.svg', svgEn);
              }

              // Расчёт текущей и рекордной серий (Streak)
              const monthsRu = ['янв.', 'февр.', 'мар.', 'апр.', 'мая', 'июн.', 'июл.', 'авг.', 'сент.', 'окт.', 'нояб.', 'дек.'];
              const monthsEn = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

              function formatStreakDate(dateStr, lang) {
                const d = new Date(dateStr + 'T00:00:00Z');
                const day = d.getUTCDate();
                const month = (lang === 'ru' ? monthsRu : monthsEn)[d.getUTCMonth()];
                return `${day} ${month}`;
              }

              // 1. Current Streak
              const daysLen = allDays.length;
              let currentStreak = 0;
              let currentStart = null;
              let currentEnd = null;

              const todayObj = allDays[daysLen - 1];
              const yesterdayObj = daysLen > 1 ? allDays[daysLen - 2] : null;

              let startIndex = -1;
              if (todayObj && todayObj.contributionCount > 0) {
                startIndex = daysLen - 1;
              } else if (yesterdayObj && yesterdayObj.contributionCount > 0) {
                startIndex = daysLen - 2;
              }

              if (startIndex !== -1) {
                currentEnd = allDays[startIndex].date;
                let i = startIndex;
                while (i >= 0 && allDays[i].contributionCount > 0) {
                  currentStreak++;
                  currentStart = allDays[i].date;
                  i--;
                }
              }

              // 2. Longest Streak
              let longestStreak = 0;
              let longestStart = null;
              let longestEnd = null;

              let tempStreak = 0;
              let tempStart = null;

              for (let i = 0; i < allDays.length; i++) {
                const day = allDays[i];
                if (day.contributionCount > 0) {
                  if (tempStreak === 0) tempStart = day.date;
                  tempStreak++;
                  if (tempStreak > longestStreak) {
                    longestStreak = tempStreak;
                    longestStart = tempStart;
                    longestEnd = day.date;
                  }
                } else {
                  tempStreak = 0;
                  tempStart = null;
                }
              }

              const currentRangeRu = currentStart && currentEnd ? (currentStart === currentEnd ? formatStreakDate(currentStart, 'ru') : `${formatStreakDate(currentStart, 'ru')} - ${formatStreakDate(currentEnd, 'ru')}`) : 'Нет серии';
              const currentRangeEn = currentStart && currentEnd ? (currentStart === currentEnd ? formatStreakDate(currentStart, 'en') : `${formatStreakDate(currentStart, 'en')} - ${formatStreakDate(currentEnd, 'en')}`) : 'No streak';

              const longestRangeRu = longestStart && longestEnd ? `${formatStreakDate(longestStart, 'ru')} - ${formatStreakDate(longestEnd, 'ru')}` : 'Нет';
              const longestRangeEn = longestStart && longestEnd ? `${formatStreakDate(longestStart, 'en')} - ${formatStreakDate(longestEnd, 'en')}` : 'None';

              // Обновляем русскую версию Streak SVG
              if (fs.existsSync('github-streak.svg')) {
                let streakRu = fs.readFileSync('github-streak.svg', 'utf8');
                streakRu = streakRu.replace(/(<text id="streak-total-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                streakRu = streakRu.replace(/(<text id="streak-current-count"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${currentStreak}\n        $2`);
                streakRu = streakRu.replace(/(<text id="streak-current-range"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${currentRangeRu}\n        $2`);
                streakRu = streakRu.replace(/(<text id="streak-longest-count"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${longestStreak}\n        $2`);
                streakRu = streakRu.replace(/(<text id="streak-longest-range"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${longestRangeRu}\n        $2`);
                fs.writeFileSync('github-streak.svg', streakRu);
              }

              // Обновляем английскую версию Streak SVG
              if (fs.existsSync('github-streak-en.svg')) {
                let streakEn = fs.readFileSync('github-streak-en.svg', 'utf8');
                streakEn = streakEn.replace(/(<text id="streak-total-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                streakEn = streakEn.replace(/(<text id="streak-current-count"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${currentStreak}\n        $2`);
                streakEn = streakEn.replace(/(<text id="streak-current-range"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${currentRangeEn}\n        $2`);
                streakEn = streakEn.replace(/(<text id="streak-longest-count"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${longestStreak}\n        $2`);
                streakEn = streakEn.replace(/(<text id="streak-longest-range"[^>]*>)[^<]*(<\/text>)/, `$1\n          ${longestRangeEn}\n        $2`);
                fs.writeFileSync('github-streak-en.svg', streakEn);
              }

              console.log(`Updated stats: Stars=${totalStars}, Commits=${totalCommits}, PRs=${totalPRs}, Issues=${totalIssues}, Streak=${currentStreak}`);
            } catch (err) {
              console.error('Error updating stats:', err);
            }

      - name: Update Project Catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/update-catalog.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-stats-en.svg github-streak.svg github-streak-en.svg README.md README.en.md
          git diff --staged --quiet || (git commit -m "Auto-update profile stats and catalog [skip ci]" && git push) || echo "No changes"
