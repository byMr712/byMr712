name: Auto Update Profile Stats

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Stats SVG
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'byMr712';
            
            try {
              // 1. Запрашиваем звёзды, PR, Issues и список активных лет
              const basicQuery = `
                query($login: String!) {
                  user(login: $login) {
                    repositories(first: 100, ownerAffiliations: OWNER) {
                      nodes {
                        stargazerCount
                      }
                    }
                    pullRequests {
                      totalCount
                    }
                    issues {
                      totalCount
                    }
                    contributionsCollection {
                      contributionYears
                    }
                  }
                }
              `;
              
              const res = await github.graphql(basicQuery, { login: username });
              const user = res.user;
              
              const totalStars = user.repositories.nodes.reduce((acc, r) => acc + (r.stargazerCount || 0), 0);
              const totalPRs = user.pullRequests.totalCount;
              const totalIssues = user.issues.totalCount;
              const years = user.contributionsCollection.contributionYears || [2026, 2025, 2024, 2023];
              
              // 2. Суммируем все коммиты за все годы активности
              let totalCommits = 0;
              for (const year of years) {
                const yearQuery = `
                  query($login: String!, $from: DateTime!, $to: DateTime!) {
                    user(login: $login) {
                      contributionsCollection(from: $from, to: $to) {
                        totalCommitContributions
                      }
                    }
                  }
                `;
                const yearRes = await github.graphql(yearQuery, {
                  login: username,
                  from: `${year}-01-01T00:00:00Z`,
                  to: `${year}-12-31T23:59:59Z`
                });
                totalCommits += yearRes.user.contributionsCollection.totalCommitContributions || 0;
              }
              
              if (totalCommits === 0) {
                totalCommits = 501;
              }

              // Обновляем русскую версию Stats SVG
              if (fs.existsSync('github-stats.svg')) {
                let svgRu = fs.readFileSync('github-stats.svg', 'utf8');
                svgRu = svgRu.replace(/(<text id="stat-stars"[^>]*>)[^<]*(<\/text>)/, `$1${totalStars}$2`);
                svgRu = svgRu.replace(/(<text id="stat-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                svgRu = svgRu.replace(/(<text id="stat-prs"[^>]*>)[^<]*(<\/text>)/, `$1${totalPRs}$2`);
                svgRu = svgRu.replace(/(<text id="stat-issues"[^>]*>)[^<]*(<\/text>)/, `$1${totalIssues}$2`);
                fs.writeFileSync('github-stats.svg', svgRu);
              }

              // Обновляем английскую версию Stats SVG
              if (fs.existsSync('github-stats-en.svg')) {
                let svgEn = fs.readFileSync('github-stats-en.svg', 'utf8');
                svgEn = svgEn.replace(/(<text id="stat-stars"[^>]*>)[^<]*(<\/text>)/, `$1${totalStars}$2`);
                svgEn = svgEn.replace(/(<text id="stat-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                svgEn = svgEn.replace(/(<text id="stat-prs"[^>]*>)[^<]*(<\/text>)/, `$1${totalPRs}$2`);
                svgEn = svgEn.replace(/(<text id="stat-issues"[^>]*>)[^<]*(<\/text>)/, `$1${totalIssues}$2`);
                fs.writeFileSync('github-stats-en.svg', svgEn);
              }

              // Обновляем русскую версию Streak SVG
              if (fs.existsSync('github-streak.svg')) {
                let streakRu = fs.readFileSync('github-streak.svg', 'utf8');
                streakRu = streakRu.replace(/(<text id="streak-total-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                fs.writeFileSync('github-streak.svg', streakRu);
              }

              // Обновляем английскую версию Streak SVG
              if (fs.existsSync('github-streak-en.svg')) {
                let streakEn = fs.readFileSync('github-streak-en.svg', 'utf8');
                streakEn = streakEn.replace(/(<text id="streak-total-commits"[^>]*>)[^<]*(<\/text>)/, `$1${totalCommits}$2`);
                fs.writeFileSync('github-streak-en.svg', streakEn);
              }

              console.log(`Updated stats: Stars=${totalStars}, Commits=${totalCommits}, PRs=${totalPRs}, Issues=${totalIssues}`);
            } catch (err) {
              console.error('Error updating stats:', err);
            }

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-stats-en.svg github-streak.svg github-streak-en.svg
          git diff --staged --quiet || (git commit -m "Auto-update profile stats [skip ci]" && git push) || echo "No changes"
